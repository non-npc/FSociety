[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fsociety-client"
version = "0.3.4"
description = "An offline-first Nostr and Blossom desktop messenger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyQt6>=6.7",
  "numpy>=2.0",
  "cryptography>=43",
  "nostr-sdk==0.45.0",
  "websockets>=15",
  "httpx>=0.27",
]

[project.scripts]
fsociety = "fsociety_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fsociety_client"]
